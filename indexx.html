<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple 3D Chess Sandbox</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* --- 3D Effects Setup --- */
        .chess-container {
            perspective: 1000px; /* Gives the 3D depth */
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 15px solid #3e2723;
            border-radius: 8px;
            
            /* 3D Board Rotation & Shadow */
            transform: rotateX(40deg) rotateZ(0deg);
            transform-style: preserve-3d;
            box-shadow: 0 30px 40px rgba(0,0,0,0.6), 0 15px 0 #1a0f0d;
            transition: transform 0.3s ease;
        }

        /* Hover effect to tilt the board slightly */
        .board:hover {
            transform: rotateX(30deg) rotateZ(0deg);
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        /* Board Colors */
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        .selected { background-color: #ffeb3b !important; }

        /* Make pieces pop out in 3D */
        .piece {
            transform: translateZ(15px); /* Lifts pieces off the board */
            text-shadow: 0 5px 2px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .piece:hover {
            transform: translateZ(25px) scale(1.1); /* Lift more on hover */
        }
    </style>
</head>
<body>

<div class="chess-container">
    <div class="board" id="chessboard"></div>
</div>

<script>
    // 1. Setup the basic variables
    const boardElement = document.getElementById('chessboard');
    let selectedSquare = null;

    // 2. Unicode chess pieces (Easy to read instead of image files!)
    const pieces = {
        'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟', // Black
        'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙', // White
        '': '' // Empty square
    };

    // 3. The initial layout of the board (Grid format)
    const initialBoard = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
        ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
    ];

    // 4. Function to draw the board on the screen
    function createBoard() {
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                // Create a square div
                const square = document.createElement('div');
                square.classList.add('square');
                
                // Make a checkerboard pattern (light/dark)
                if ((row + col) % 2 === 0) {
                    square.classList.add('light');
                } else {
                    square.classList.add('dark');
                }
                
                // Put the piece on the square if there is one
                const pieceChar = initialBoard[row][col];
                if (pieceChar !== '') {
                    const pieceSpan = document.createElement('span');
                    pieceSpan.classList.add('piece');
                    pieceSpan.textContent = pieces[pieceChar];
                    square.appendChild(pieceSpan);
                }

                // Add click events to move pieces
                square.addEventListener('click', onSquareClick);
                boardElement.appendChild(square);
            }
        }
    }

    // 5. Function to handle clicking and moving pieces
    function onSquareClick(event) {
        const clickedSquare = event.currentTarget;
        
        // If we already selected a piece earlier
        if (selectedSquare) {
            if (selectedSquare !== clickedSquare) {
                // Move the piece to the new square
                const pieceToMove = selectedSquare.querySelector('.piece');
                if (pieceToMove) {
                    clickedSquare.innerHTML = ''; // Clear target square
                    clickedSquare.appendChild(pieceToMove); // Drop piece
                }
            }
            // Remove the highlight glow
            selectedSquare.classList.remove('selected');
            selectedSquare = null;
        } else {
            // Pick up a piece (highlight it)
            if (clickedSquare.querySelector('.piece')) {
                selectedSquare = clickedSquare;
                selectedSquare.classList.add('selected');
            }
        }
    }

    // Start the game!
    createBoard();
</script>

</body>
</html>
